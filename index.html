<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocena Ryzyka Chemicznego</title>

<style>

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    margin-bottom:20px;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

h1{
    color:#003366;
}

h2{
    color:#003366;
    border-bottom:1px solid #ddd;
    padding-bottom:8px;
}

input[type=text],
input[type=number],
select,
textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

textarea{
    resize:vertical;
}

button{
    background:#005fb8;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#00468a;
}

.hidden{
    display:none;
}

.result{
    background:#eef6ff;
    border-left:4px solid #005fb8;
    padding:15px;
    margin-top:10px;
}

.badge{
    padding:8px 12px;
    color:white;
    border-radius:6px;
    font-weight:bold;
}

.low{
    background:#2e7d32;
}

.medium{
    background:#f9a825;
}

.high{
    background:#c62828;
}

</style>
</head>

<body>

<div class="container">

<h1>Ocena Ryzyka Chemicznego</h1>

<div class="card">

<h2>1. Źródło danych</h2>

<label>
<input type="radio" name="source" checked onclick="toggleSource()">
 Wyszukaj KCh w internecie
</label>

<br><br>

<label>
<input type="radio" name="source" onclick="toggleSource()">
 Załącz KCh PDF
</label>

<div id="searchSection">

<br>

<label>Nazwa produktu</label>
<input type="text" id="productName"
placeholder="np. Sika Cleaner-205">

<button onclick="searchDoc()">Wyszukaj KCh</button>

<div id="searchResult"></div>

</div>

<div id="uploadSection" class="hidden">

<br>

<label>Załącz KCh</label>

<input type="file">

</div>

</div>

<div class="card">

<h2>2. Stanowisko pracy</h2>

<label>Stanowisko</label>
<input type="text" id="jobTitle">

<label>Wydział / Lokalizacja</label>
<input type="text">

<label>Opis wykonywanych czynności</label>
<textarea id="activities" rows="4"></textarea>

<label>Ilość zużywanej substancji</label>
<input type="text"
placeholder="np. 5 litrów tygodniowo">

<label>Częstotliwość stosowania</label>

<select>
<option>Sporadycznie</option>
<option>Kilka razy w miesiącu</option>
<option>Kilka razy w tygodniu</option>
<option>Codziennie</option>
</select>

</div>

<div class="card">

<h2>3. Ekspozycja</h2>

<label>
<input type="checkbox"> Kontakt ze skórą
</label><br>

<label>
<input type="checkbox"> Kontakt z oczami
</label><br>

<label>
<input type="checkbox"> Narażenie inhalacyjne
</label><br>

<label>
<input type="checkbox"> Ryzyko połknięcia
</label>

</div>

<div class="card">

<h2>4. Analiza AI</h2>

<button onclick="runAI()">Analizuj zagrożenia</button>

<div id="aiResult"></div>

</div>

<div class="card">

<h2>5. Ocena ryzyka</h2>

<label>Ciężkość skutków</label>
<select id="s">
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
</select>

<label>Prawdopodobieństwo</label>
<select id="p">
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
</select>

<label>Ekspozycja</label>
<select id="e">
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
</select>

<button onclick="calculateRisk()">Oblicz</button>

<div id="riskResult"></div>

</div>

<div class="card">

<h2>6. Raport końcowy</h2>

<div class="result">

<p><strong>Produkt:</strong> -</p>
<p><strong>Stanowisko:</strong> -</p>
<p><strong>Zagrożenia:</strong> -</p>
<p><strong>ŚOI:</strong> -</p>
<p><strong>Poziom ryzyka:</strong> -</p>

</div>

<br>

<button>Eksport PDF (przyszła funkcja)</button>

</div>

</div>

<script>

function toggleSource(){

const radios =
document.getElementsByName("source");

if(radios[0].checked){

document.getElementById(
"searchSection").classList.remove("hidden");

document.getElementById(
"uploadSection").classList.add("hidden");

}
else{

document.getElementById(
"uploadSection").classList.remove("hidden");

document.getElementById(
"searchSection").classList.add("hidden");
}
}

function searchDoc() {

    const product =
    document.getElementById("productName").value.trim();

    if(product === ""){
        alert("Wpisz nazwę produktu");
        return;
    }

    const query =
    `"${product}" "karta charakterystyki" filetype:pdf`;

    const url =
    `https://www.google.com/search?q=${encodeURIComponent(query)}`;

    window.open(url, "_blank");
}

document.getElementById(
"searchResult").innerHTML=

`
<div class="result">

<b>Znaleziono potencjalną kartę charakterystyki</b><br><br>

Produkt: ${product}<br>
Status: znaleziono dokument PDF<br>
Producent: do pobrania z internetu<br>

<br>

<i>W wersji docelowej tutaj pojawi się wynik wyszukiwania AI.</i>

</div>
`;

}

function runAI(){

document.getElementById(
"aiResult").innerHTML=

`
<div class="result">

<b>Proponowane zagrożenia</b>

<ul>
<li>Kontakt chemiczny ze skórą</li>
<li>Kontakt z oczami</li>
<li>Narażenie na pary</li>
<li>Rozlanie substancji</li>
</ul>

<b>Rekomendowane środki ochrony</b>

<ul>
<li>Rękawice nitrylowe</li>
<li>Okulary ochronne</li>
<li>Wentylacja miejscowa</li>
<li>Instrukcja bezpiecznej pracy</li>
</ul>

</div>
`;
}

function calculateRisk(){

let s =
parseInt(document.getElementById("s").value);

let p =
parseInt(document.getElementById("p").value);

let e =
parseInt(document.getElementById("e").value);

let score = s*p*e;

let level="";
let cls="";

if(score<=20){
level="Niskie";
cls="low";
}
else if(score<=50){
level="Średnie";
cls="medium";
}
else{
level="Wysokie";
cls="high";
}

document.getElementById("riskResult").innerHTML=

`
<div class="result">

Wynik: ${score}

<br><br>

<span class="badge ${cls}">
${level}
</span>

</div>
`;

}

</script>

</body>
</html>
